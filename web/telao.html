<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rede One · Telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body.sem-cursor { cursor: none; }
  @keyframes entra { from { opacity: 0; transform: translateY(3vh) scale(.97); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* ── cabeçalho comum ── */
  .topo { display: flex; align-items: center; gap: 1.6vw; }
  .topo .marca { font-size: clamp(34px, 4.4vw, 96px); }
  .topo .div { width: 1px; align-self: stretch; background: linear-gradient(transparent, rgba(255,255,255,.35), transparent); }
  .topo .palestra { display: flex; flex-direction: column; gap: .5vh; }
  .topo .quem { font-size: clamp(11px, .95vw, 20px); font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--destaque); }
  .topo .tema { font-size: clamp(16px, 1.6vw, 34px); font-weight: 500; color: #fff; }

  /* ── QR em vidro claro ── */
  .qr-card { background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(236,242,255,.9)); color: #0a1a55; border-radius: 2.6vh; padding: 2.2vh 1.4vw; text-align: center;
    box-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(255,255,255,.4), 0 24px 70px rgba(0,4,30,.55), 0 0 60px rgba(244,205,92,.18); }
  .qr-card .chamada { font-weight: 700; font-size: clamp(14px, 1.35vw, 30px); line-height: 1.2; margin-bottom: 1.4vh; }
  .qr-card .chamada b { color: #b8860b; }
  .qr { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .qr-card .url { margin-top: 1.2vh; font-size: clamp(10px, .85vw, 18px); font-weight: 600; color: #4a5a99; word-break: break-all; }

  /* ── cartões de pergunta (vidro) ── */
  .card { flex: 0 0 auto; position: relative; background: var(--cartao); border: 1px solid var(--borda); border-radius: 2.2vh; padding: 2.4vh 2vw 2.4vh 2.4vw;
    box-shadow: var(--brilho), 0 18px 50px rgba(0,4,30,.4); animation: entra .8s cubic-bezier(.2,.9,.25,1) both; transition: opacity .5s, transform .5s; }
  .card::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; border-radius: 3px; background: var(--ouro); opacity: .9; }
  .card .txt { font-size: clamp(18px, 2.1vw, 46px); font-weight: 500; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .quem { margin-top: 1.1vh; font-size: clamp(12px, 1.1vw, 24px); color: var(--destaque); font-weight: 600; letter-spacing: .04em; }
  .card.fixa { background: linear-gradient(140deg, rgba(244,205,92,.24), rgba(244,205,92,.07)); border-color: rgba(244,205,92,.75); padding: 3.4vh 2.6vw 3.4vh 3vw; box-shadow: var(--brilho), 0 0 70px rgba(244,205,92,.18), 0 22px 60px rgba(0,4,30,.45); }
  .card.fixa::before { width: 4px; top: 14%; bottom: 14%; }
  .card.fixa .txt { font-size: clamp(24px, 3.1vw, 68px); font-weight: 600; }
  .selo { display: inline-flex; align-items: center; gap: .5vw; font-size: clamp(11px, .9vw, 19px); font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #0a1a55; background: var(--ouro); padding: .6vh 1vw; border-radius: 99px; margin-bottom: 1.6vh; }
  .card.sai { opacity: 0; transform: translateX(-3vw) scale(.97); }
  .mais { font-size: clamp(12px, 1.1vw, 24px); color: var(--texto-3); font-weight: 600; margin-top: 1vh; letter-spacing: .04em; }

  /* ── modo Perguntas ── */
  .palco { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: 1fr minmax(260px, 21vw); gap: 3vw; padding: 5vh 3.6vw 4.4vh; }
  .esq { display: flex; flex-direction: column; min-height: 0; }
  .esq .topo { margin-bottom: 3.6vh; }
  .lista { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.8vh; overflow: hidden; }
  .vazio { margin: auto 0; max-width: 46vw; animation: entra .8s both; }
  .vazio h2 { font-size: clamp(28px, 3.6vw, 78px); font-weight: 300; margin: 0 0 2vh; line-height: 1.08; }
  .vazio h2 b { font-weight: 600; background: var(--ouro); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .vazio p { font-size: clamp(16px, 1.55vw, 34px); color: var(--texto-2); margin: 0; line-height: 1.4; }
  .dir { display: flex; flex-direction: column; justify-content: flex-end; }

  /* ── modos Imagem e Slides: a peça principal grande e as perguntas ao lado ── */
  #tela { position: fixed; inset: 0; z-index: 5; display: none; }
  body.tela #tela { display: block; }
  body.tela .palco { display: none; }
  .peca { position: absolute; top: 3.4vh; bottom: 3.4vh; left: 2.6vw; right: 2.6vw; display: grid; place-items: center; transition: right .5s cubic-bezier(.2,.9,.25,1); }
  #tela.com-lado .peca { right: calc(min(23vw, 430px) + 4.4vw); }
  .moldura { position: relative; max-width: 100%; max-height: 100%; border-radius: 1.6vh; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 30px 90px rgba(0,4,30,.65), 0 0 90px rgba(47,107,255,.2); }
  .moldura img, .moldura canvas { display: block; max-width: 100%; max-height: calc(100vh - 6.8vh); width: auto; height: auto; }
  .moldura canvas.escondido, .moldura img.escondido { display: none; }
  #tela-carregando { position: absolute; inset: 0; display: grid; place-items: center; color: var(--texto-2); font-size: 22px; }
  .lado { position: absolute; top: 3.4vh; right: 2.2vw; bottom: 3.4vh; width: min(23vw, 430px); display: flex; flex-direction: column; gap: 1.4vh; transition: opacity .45s, transform .45s; }
  .lado.fora { opacity: 0; transform: translateX(4vw); pointer-events: none; }
  .lado .rot { display: flex; align-items: center; justify-content: space-between; font-size: clamp(11px, .9vw, 19px); font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--destaque); }
  .lado .rot span:last-child { letter-spacing: .04em; color: var(--texto-3); font-weight: 600; }
  #lado-lista { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; overflow: hidden; flex: 1; }
  .mini { position: relative; background: linear-gradient(145deg, rgba(10,26,85,.72), rgba(10,26,85,.5)); border: 1px solid rgba(255,255,255,.2); border-radius: 1.8vh; padding: 1.7vh 1.1vw 1.7vh 1.4vw; box-shadow: var(--brilho), 0 14px 40px rgba(0,4,30,.45); animation: entra .7s both; }
  .mini::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--ouro); }
  .mini .txt { font-size: clamp(13px, 1.1vw, 24px); font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .quem { margin-top: .7vh; font-size: clamp(11px, .82vw, 17px); color: var(--destaque); font-weight: 600; }
  .lado .qr-card { padding: 1.6vh 1vw; display: grid; grid-template-columns: 42% 1fr; gap: .9vw; align-items: center; text-align: left; }
  .lado .qr-card .chamada { margin: 0; font-size: clamp(12px, 1.05vw, 22px); }
  .lado .qr { width: 100%; }
  .num-slide { position: absolute; left: 2.6vw; bottom: 1vh; font-size: 12px; color: rgba(255,255,255,.45); font-weight: 600; letter-spacing: .1em; }

  /* ── modo Respostas: pergunta do pastor + mural ── */
  #mural { position: fixed; inset: 0; z-index: 4; display: none; grid-template-columns: 1fr minmax(240px, 19vw); gap: 2.8vw; padding: 4.6vh 3.4vw 4vh; }
  body.mural #mural { display: grid; }
  body.mural .palco { display: none; }
  .m-esq { display: flex; flex-direction: column; min-height: 0; }
  .m-perg { position: relative; border-radius: 2.6vh; padding: 3vh 2.4vw; margin: 3vh 0 2.8vh; background: linear-gradient(140deg, rgba(244,205,92,.24), rgba(244,205,92,.06)); border: 1px solid rgba(244,205,92,.75);
    box-shadow: var(--brilho), 0 0 80px rgba(244,205,92,.16), 0 24px 70px rgba(0,4,30,.45); backdrop-filter: var(--desfoque); -webkit-backdrop-filter: var(--desfoque); }
  .m-perg .rot { font-size: clamp(11px, .95vw, 20px); font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--destaque); }
  .m-perg .txt { font-size: clamp(26px, 3.2vw, 70px); font-weight: 600; line-height: 1.12; margin-top: 1.2vh; }
  .parede { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 1.6vh 1.2vw; overflow: hidden; align-content: start; }
  .rc { position: relative; background: var(--cartao); border: 1px solid var(--borda); border-radius: 2vh; padding: 2vh 1.2vw 2vh 1.5vw; box-shadow: var(--brilho), 0 14px 40px rgba(0,4,30,.35); animation: entra .7s both; }
  .rc::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--ouro); }
  .rc .txt { font-size: clamp(14px, 1.3vw, 29px); font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .rc .quem { margin-top: .8vh; font-size: clamp(11px, .9vw, 19px); color: var(--destaque); font-weight: 600; }
  .m-dir { display: flex; flex-direction: column; justify-content: flex-end; gap: 2.6vh; }
  .m-conta { text-align: center; }
  .m-conta b { display: block; font-size: clamp(46px, 5.4vw, 120px); font-weight: 300; line-height: 1; background: var(--ouro); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .m-conta span { font-size: clamp(12px, 1vw, 22px); color: var(--texto-2); font-weight: 600; letter-spacing: .26em; text-transform: uppercase; }
  .m-vazio { grid-column: 1 / -1; font-size: clamp(18px, 1.9vw, 40px); font-weight: 300; color: var(--texto-2); margin-top: 3vh; }

  /* ── pergunta inteira (fundo desfocado) ── */
  #destaque { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 6vh 7vw;
    background: radial-gradient(70vw 70vh at 50% 50%, rgba(10,26,85,.35), rgba(3,10,40,.78)); backdrop-filter: blur(26px) saturate(1.2); -webkit-backdrop-filter: blur(26px) saturate(1.2);
    opacity: 0; pointer-events: none; transition: opacity .5s; }
  #destaque.vis { opacity: 1; }
  #destaque .caixa { max-width: 80vw; text-align: center; transform: scale(.94) translateY(2vh); transition: transform .6s cubic-bezier(.2,.9,.25,1); }
  #destaque.vis .caixa { transform: none; }
  #destaque .selo { margin-bottom: 3.4vh; font-size: clamp(13px, 1.15vw, 24px); padding: .9vh 1.6vw; }
  #destaque .txt { font-size: clamp(32px, 4.6vw, 104px); font-weight: 600; line-height: 1.14; text-shadow: 0 8px 40px rgba(0,4,30,.6); }
  #destaque .quem { margin-top: 3.4vh; font-size: clamp(18px, 1.9vw, 42px); color: var(--destaque); font-weight: 600; letter-spacing: .06em; }
  #destaque .linha-ouro { width: 8vw; height: 2px; margin: 3.4vh auto 0; background: var(--ouro); border-radius: 2px; }

  .estado { position: fixed; top: 1.6vh; right: 1.4vw; z-index: 30; display: flex; gap: 10px; }
  .pill { font-size: clamp(11px, .85vw, 17px); font-weight: 700; padding: .6vh 1vw; border-radius: 99px; background: rgba(10,26,85,.6); border: 1px solid var(--borda); backdrop-filter: var(--desfoque); }
  .pill.vermelho { background: rgba(255,107,129,.3); border-color: rgba(255,107,129,.7); }
  #tela-cheia { position: fixed; left: 1.4vw; bottom: 1.6vh; z-index: 30; transition: opacity .4s; padding: 10px 14px; font-size: 14px; }
  body.sem-cursor #tela-cheia { opacity: 0; pointer-events: none; }
  dialog { border: 1px solid var(--borda); border-radius: 20px; background: rgba(10,26,85,.85); color: var(--texto); padding: 22px; width: min(380px, 90vw); box-shadow: var(--brilho), var(--sombra); }
  dialog::backdrop { background: rgba(0,4,30,.6); backdrop-filter: blur(6px); }
  dialog input { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--borda); background: rgba(4,16,64,.5); font-size: 22px; text-align: center; letter-spacing: .4em; margin: 12px 0; outline: none; }
  dialog .linha { display: flex; gap: 10px; }
  dialog .linha .btn { flex: 1; font-size: 15px; padding: 11px; }
  @media (max-width: 760px) {
    html, body { overflow: auto; }
    .palco { grid-template-columns: 1fr; height: auto; min-height: 100vh; padding: 20px 16px; }
    .vazio { max-width: none; }
    .dir { max-width: 260px; }
  }
</style>
</head>
<body>
<div class="estado"><span class="pill oculto" id="p-fechado">⏸️ Envio pausado</span><span class="pill vermelho oculto" id="p-offline">Sem conexão · tentando de novo</span></div>

<!-- Perguntas -->
<div class="palco">
  <section class="esq">
    <div class="topo">
      <div class="marca" id="titulo">Rede <b>One</b></div><div class="div"></div>
      <div class="palestra"><div class="quem" id="quem">Palestra</div><div class="tema" id="tema"></div></div>
    </div>
    <div class="lista" id="lista"></div>
  </section>
  <aside class="dir">
    <div class="qr-card">
      <div class="chamada">📱 Aponte a câmera<br>e mande sua <b>pergunta</b></div>
      <div class="qr" id="qr"></div>
      <div class="url" id="url"></div>
    </div>
  </aside>
</div>

<!-- Imagem / Slides -->
<section id="tela" aria-label="Imagem ou apresentação">
  <div class="peca"><div class="moldura" id="moldura">
    <img id="img-tela" alt="" class="escondido">
    <canvas id="slide-a" class="escondido"></canvas><canvas id="slide-b" class="escondido"></canvas>
  </div><div id="tela-carregando" class="oculto">Carregando…</div></div>
  <aside class="lado" id="lado">
    <div class="rot"><span>💬 Perguntas</span><span id="lado-n"></span></div>
    <div id="lado-lista"></div>
    <div class="qr-card"><div class="qr" id="qr2"></div><div class="chamada">📱 Mande sua <b>pergunta</b> pelo celular</div></div>
  </aside>
  <div class="num-slide" id="num-slide"></div>
</section>

<!-- Respostas à pergunta do pastor -->
<section id="mural" aria-label="Respostas à pergunta do pastor">
  <div class="m-esq">
    <div class="topo">
      <div class="marca" id="titulo2">Rede <b>One</b></div><div class="div"></div>
      <div class="palestra"><div class="quem" id="quem2">Palestra</div><div class="tema" id="tema2"></div></div>
    </div>
    <div class="m-perg"><div class="rot" id="m-rot">Pergunta do pastor</div><div class="txt" id="m-perg"></div></div>
    <div class="parede" id="parede"></div>
  </div>
  <aside class="m-dir">
    <div class="m-conta"><b id="m-n">0</b><span>respostas</span></div>
    <div class="qr-card"><div class="chamada">📱 Responda pelo <b>celular</b></div><div class="qr" id="qr3"></div><div class="url" id="url3"></div></div>
  </aside>
</section>

<div id="destaque" aria-live="polite">
  <div class="caixa"><div class="selo">💬 Pergunta</div><div class="txt" id="d-txt"></div><div class="quem" id="d-quem"></div><div class="linha-ouro"></div></div>
</div>

<button class="btn sec" id="tela-cheia">⛶ Tela cheia (F)</button>

<dialog id="pede-pin">
  <b>PIN para passar os slides daqui</b>
  <input id="pin-telao" type="password" inputmode="numeric" maxlength="12" placeholder="••••">
  <div class="linha"><button class="btn sec" id="pin-cancelar">Cancelar</button><button class="btn" id="pin-ok">OK</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX = 5;
  const params = new URLSearchParams(location.search);
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  // QR para a tela do celular (?link= troca o endereço, útil no teste local)
  const destino = params.get("link") || new URL("perguntar.html" + (REDEONE.evento !== "ativo" ? `?evento=${encodeURIComponent(REDEONE.evento)}` : ""), location.href).href;
  for (const alvo of ["qr", "qr2", "qr3"]) {
    try { const q = qrcode(0, "M"); q.addData(destino); q.make(); $(alvo).innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); }
    catch { $(alvo).textContent = "QR indisponível"; }
  }
  $("url").textContent = $("url3").textContent = destino.replace(/^https?:\/\//, "");

  // ── Perguntas ──
  const atual = new Map();
  function render(perguntas) {
    const lista = $("lista");
    const fixa = perguntas.find((p) => p.fixada);
    const outras = perguntas.filter((p) => !p.fixada);
    const mostrar = (fixa ? [fixa] : []).concat(outras.slice(0, fixa ? MAX - 1 : MAX));
    const extra = perguntas.length - mostrar.length;
    const ids = new Set(mostrar.map((p) => p.id + (p.fixada ? ":f" : "")));
    for (const [id, el] of atual) if (!ids.has(id)) { el.classList.add("sai"); setTimeout(() => el.remove(), 500); atual.delete(id); }
    lista.querySelector(".vazio")?.remove();
    lista.querySelector(".mais")?.remove();
    mostrar.forEach((p, i) => {
      const chave = p.id + (p.fixada ? ":f" : "");
      let el = atual.get(chave);
      if (!el) {
        el = document.createElement("article"); el.className = "card" + (p.fixada ? " fixa" : "");
        if (p.fixada) { const s = document.createElement("div"); s.className = "selo"; s.textContent = "📌 Em destaque"; el.appendChild(s); }
        const t = document.createElement("div"); t.className = "txt"; t.textContent = p.texto; el.appendChild(t);
        const q = document.createElement("div"); q.className = "quem"; q.textContent = p.nome || "Anônimo"; el.appendChild(q);
        atual.set(chave, el);
      }
      const ref = lista.children[i];
      if (ref !== el) lista.insertBefore(el, ref || null);
    });
    if (!mostrar.length) {
      const v = document.createElement("div"); v.className = "vazio";
      v.innerHTML = "<h2>Tem uma <b>pergunta</b>?</h2><p>Aponte a câmera do celular para o QR Code e mande. Pode ser anônima.</p>";
      lista.appendChild(v); return;
    }
    const m = document.createElement("div"); m.className = "mais"; m.textContent = "+ 0 na fila"; lista.appendChild(m);
    const cards = [...lista.querySelectorAll(".card:not(.sai)")];
    cards.forEach((c) => c.classList.remove("oculto"));
    let escondidos = 0;
    const passou = () => m.offsetTop + m.offsetHeight > lista.clientHeight + 1;   // medida que a animação não engana
    for (let i = cards.length - 1; i > 0 && passou(); i--) { cards[i].classList.add("oculto"); escondidos++; }
    const fila = extra + escondidos;
    if (fila > 0) m.textContent = `+ ${fila} na fila`; else m.remove();
  }

  // ── Coluna de perguntas ao lado da imagem/slides ──
  let ladoChave = null, ladoVisivel = null;
  function renderLado(perguntas, mostrar) {
    $("lado").classList.toggle("fora", !mostrar);
    $("tela").classList.toggle("com-lado", !!mostrar);
    if (ladoVisivel !== null && ladoVisivel !== !!mostrar && modoTela === "slides") desenhar(paginaDesenhada || 1, true);
    ladoVisivel = !!mostrar;
    $("lado-n").textContent = perguntas.length ? `${perguntas.length} no telão` : "";
    const lista = perguntas.slice(0, 4);
    const chave = lista.map((p) => p.id + (p.fixada ? "f" : "")).join(",");
    if (chave === ladoChave) return;
    ladoChave = chave;
    const caixa = $("lado-lista"); caixa.innerHTML = "";
    if (!lista.length) {
      const v = document.createElement("div"); v.className = "mini";
      v.innerHTML = '<div class="txt">Tem uma pergunta? Leia o QR Code aqui embaixo 👇</div>'; caixa.appendChild(v); return;
    }
    for (const p of lista) {
      const el = document.createElement("div"); el.className = "mini";
      const t = document.createElement("div"); t.className = "txt"; t.textContent = p.texto; el.appendChild(t);
      const q = document.createElement("div"); q.className = "quem"; q.textContent = (p.fixada ? "📌 " : "") + (p.nome || "Anônimo"); el.appendChild(q);
      caixa.appendChild(el);
    }
    const itens = [...caixa.children];   // só o que cabe inteiro
    for (let i = itens.length - 1; i > 0 && itens[i].offsetTop + itens[i].offsetHeight > caixa.clientHeight + 1; i--) itens[i].classList.add("oculto");
  }

  // ── Imagem (banner) ──
  let modoTela = null;
  function mostrarImagem(url) {
    modoTela = "imagem";
    const img = $("img-tela");
    ["slide-a", "slide-b"].forEach((id) => $(id).classList.add("escondido"));
    $("num-slide").textContent = ""; $("tela-carregando").classList.add("oculto");
    if (img.dataset.url !== url) { img.dataset.url = url; img.src = url; }
    img.classList.remove("escondido");
  }

  // ── Slides (PDF com pdf.js, um desenho por vez) ──
  let pdf = null, pdfUrl = null, paginaDesenhada = 0, desenhando = null, pedida = 1, frente = "slide-a";
  async function carregarPdf(url) {
    if (url === pdfUrl) return;
    pdfUrl = url; pdf = null; paginaDesenhada = 0;
    $("tela-carregando").classList.remove("oculto"); $("tela-carregando").textContent = "Carregando a apresentação…";
    try { pdf = await pdfjsLib.getDocument({ url }).promise; $("tela-carregando").classList.add("oculto"); }
    catch { $("tela-carregando").textContent = "Não consegui abrir o PDF da apresentação."; }
  }
  async function desenhar(n, forcar) {
    pedida = n;
    if (!pdf || (n === paginaDesenhada && !forcar) || desenhando) return;
    desenhando = (async () => {
      const num = Math.min(Math.max(n, 1), pdf.numPages);
      const pagina = await pdf.getPage(num);
      const base = pagina.getViewport({ scale: 1 });
      const peca = document.querySelector(".peca");
      const dpr = devicePixelRatio || 1;
      const escala = Math.min(peca.clientWidth / base.width, peca.clientHeight / base.height);
      const vp = pagina.getViewport({ scale: escala * dpr });
      const tras = frente === "slide-a" ? "slide-b" : "slide-a";
      const cv = $(tras); cv.width = vp.width; cv.height = vp.height;
      cv.style.width = `${vp.width / dpr}px`;
      await pagina.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      if (modoTela === "slides") { cv.classList.remove("escondido"); $(frente).classList.add("escondido"); }
      frente = tras; paginaDesenhada = num;
      $("num-slide").textContent = `${num} / ${pdf.numPages}`;
      if (num < pdf.numPages) pdf.getPage(num + 1).catch(() => {});
    })().finally(() => { desenhando = null; if (pedida !== paginaDesenhada) desenhar(pedida); });
  }
  function mostrarSlides() {
    if (modoTela !== "slides") {
      modoTela = "slides"; $("img-tela").classList.add("escondido");
      if (paginaDesenhada) { $(frente === "slide-a" ? "slide-b" : "slide-a").classList.add("escondido"); }
      if (paginaDesenhada) desenhar(paginaDesenhada, true);
    }
  }

  // ── Mural de respostas ──
  const noMural = new Map();
  function renderMural(r) {
    const ev = r.evento;
    $("m-rot").textContent = `Pergunta do ${ev.subtitulo.split("·").pop().trim() || "pastor"}`;
    $("m-perg").textContent = ev.pergunta_pastor || "…";
    $("m-n").textContent = r.total_respostas_pastor ?? r.respostas_pastor.length;
    const parede = $("parede");
    const ids = new Set(r.respostas_pastor.map((x) => x.id));
    for (const [id, el] of noMural) if (!ids.has(id)) { el.remove(); noMural.delete(id); }
    parede.querySelector(".m-vazio")?.remove();
    r.respostas_pastor.forEach((x, i) => {                       // a mais nova primeiro
      let el = noMural.get(x.id);
      if (!el) {
        el = document.createElement("article"); el.className = "rc";
        const t = document.createElement("div"); t.className = "txt"; t.textContent = x.texto; el.appendChild(t);
        const q = document.createElement("div"); q.className = "quem"; q.textContent = x.nome || "Anônimo"; el.appendChild(q);
        noMural.set(x.id, el);
      }
      if (parede.children[i] !== el) parede.insertBefore(el, parede.children[i] || null);
    });
    if (!r.respostas_pastor.length) {
      const v = document.createElement("div"); v.className = "m-vazio";
      v.textContent = ev.pastor_aberta ? "Leia o QR Code e mande a sua resposta. Pode ser anônima." : "As respostas aparecem aqui quando a pergunta for aberta.";
      parede.appendChild(v); return;
    }
    const cards = [...parede.children];
    cards.forEach((c) => c.classList.remove("oculto"));
    for (let i = cards.length - 1; i > 0 && cards[i].offsetTop + cards[i].offsetHeight > parede.clientHeight + 1; i--) cards[i].classList.add("oculto");
  }

  // ── Pergunta inteira ──
  let destaqueId = null;
  function renderDestaque(d) {
    const vis = !!d;
    if (vis && d.id !== destaqueId) { $("d-txt").textContent = d.texto; $("d-quem").textContent = d.nome || "Anônimo"; }
    destaqueId = vis ? d.id : null;
    $("destaque").classList.toggle("vis", vis);
  }

  let ultimo = null;
  async function atualizar() {
    try {
      const r = await redeoneApi("telao");
      $("p-offline").classList.add("oculto");
      if (!r.ok) return;
      if (redeoneTelaCerta(r.evento.modo, "telao.html", "dinamica-telao.html")) return;
      ultimo = r;
      const ev = r.evento;
      const [tema, quem] = ev.subtitulo.split("·").map((x) => x.trim());
      for (const [t, q, m] of [["tema", "quem", "titulo"], ["tema2", "quem2", "titulo2"]]) { $(t).textContent = tema || ""; $(q).textContent = quem || "Palestra"; redeoneMarca($(m), ev.titulo); }
      $("p-fechado").classList.toggle("oculto", ev.aberto);
      const imagem = params.get("banner") || ev.banner_url;
      redeoneFundo(imagem);

      const modo = ev.telao_modo === "apresentacao" && !ev.slides_url ? "imagem" : ev.telao_modo;   // sem PDF, mostra a imagem
      const telaCheia = (modo === "imagem" && !!imagem) || (modo === "apresentacao" && !!window.pdfjsLib);
      document.body.classList.toggle("tela", telaCheia);
      document.body.classList.toggle("mural", modo === "resposta");
      renderDestaque(r.destaque);
      if (modo === "resposta") renderMural(r);
      else if (telaCheia) {
        renderLado(r.perguntas, ev.mostrar_perguntas_slides);
        if (modo === "imagem") mostrarImagem(imagem);
        else { mostrarSlides(); await carregarPdf(ev.slides_url); desenhar(ev.slide_atual); }
      } else render(r.perguntas);
    } catch { $("p-offline").classList.remove("oculto"); }
  }
  window.addEventListener("resize", () => { if (modoTela === "slides") desenhar(paginaDesenhada || 1, true); atualizar(); });

  // ── Passar slide pelo passador/setas no computador da igreja (pede o PIN uma vez) ──
  const CHAVE = REDEONE.chavePin;
  const lerPin = () => { try { return localStorage.getItem(CHAVE); } catch { return null; } };
  function pedirPin() {
    return new Promise((ok) => {
      $("pin-telao").value = ""; $("pede-pin").showModal(); $("pin-telao").focus();
      $("pin-ok").onclick = () => { const v = $("pin-telao").value.trim(); $("pede-pin").close(); try { localStorage.setItem(CHAVE, v); } catch {} ok(v); };
      $("pin-cancelar").onclick = () => { $("pede-pin").close(); ok(null); };
    });
  }
  async function passar(delta) {
    if (!ultimo || modoTela !== "slides" || !document.body.classList.contains("tela")) return;
    const pin = lerPin() || await pedirPin(); if (!pin) return;
    const total = ultimo.evento.slides_total || pdf?.numPages || 1;
    const alvo = Math.min(Math.max((ultimo.evento.slide_atual || 1) + delta, 1), total);
    ultimo.evento.slide_atual = alvo; desenhar(alvo);
    const r = await redeoneApi("slide", { pin, delta }).catch(() => null);
    if (r && !r.ok && r.erro === "pin") { try { localStorage.removeItem(CHAVE); } catch {} }
    atualizar();
  }

  const cheia = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  $("tela-cheia").onclick = cheia;
  document.addEventListener("keydown", (e) => {
    if ($("pede-pin").open) { if (e.key === "Enter") $("pin-ok").click(); return; }
    if (e.key === "f" || e.key === "F") cheia();
    else if (["ArrowRight", "PageDown", " ", "ArrowDown"].includes(e.key)) { e.preventDefault(); passar(1); }
    else if (["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key)) { e.preventDefault(); passar(-1); }
  });
  let tCursor;
  const mexeu = () => { document.body.classList.remove("sem-cursor"); clearTimeout(tCursor); tCursor = setTimeout(() => document.body.classList.add("sem-cursor"), 3000); };
  document.addEventListener("mousemove", mexeu); mexeu();

  atualizar();
  redeoneAoVivo(atualizar, 1500);
})();
</script>
</body>
</html>
